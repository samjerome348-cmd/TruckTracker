<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Tracker — Log In</title>
<script>
(function(){var t=localStorage.getItem('truck-tracker-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="theme-toggle-wrap">
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark theme">
    <span class="knob"></span>
  </button>
</div>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="plate">TT</span>
      <div>
        <h1>Truck Tracker</h1>
        <div class="sub">Repairs · Materials · Expenses</div>
      </div>
    </div>
    <!-- LOG IN -->
    <div id="view-login">
      <div id="login-msg" class="msg"></div>
      <form id="form-login">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
      <div class="auth-links">
        <button id="link-to-forgot">Forgot password?</button>
        <button id="link-to-signup">Create an account</button>
      </div>
    </div>
    <!-- SIGN UP -->
    <div id="view-signup" class="hidden">
      <div id="signup-msg" class="msg"></div>
      <form id="form-signup">
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required autocomplete="new-password" minlength="8">
          <div class="helper-text">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="signup-password2">Confirm password</label>
          <input type="password" id="signup-password2" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-amber">Create account</button>
      </form>
      <div class="auth-links">
        <span></span>
        <button id="link-to-login-1">Back to log in</button>
      </div>
    </div>
    <!-- FORGOT PASSWORD -->
    <div id="view-forgot" class="hidden">
      <div id="forgot-msg" class="msg"></div>
      <p style="font-size:0.85rem;color:var(--ink-soft);margin-top:0;">
        Enter your email and we'll send a link to reset your password.
      </p>
      <form id="form-forgot">
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary">Send reset link</button>
      </form>
      <div class="auth-links">
        <span></span>
        <button id="link-to-login-2">Back to log in</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
<script src="auth.js"></script>
</body>
</html>
