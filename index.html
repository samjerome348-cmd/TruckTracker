<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truck Tracker — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle-wrap">
    <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle Theme">
      <span class="knob"></span>
    </button>
  </div>

  <div id="app-layout" class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="plate">TT</span>
        <div>
          <h1>Truck Tracker</h1>
          <span class="sub">Fleet & Maintenance</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" id="nav-fleet" onclick="switchView('fleet')">🚛 Fleet Dashboard</button>
        <button class="nav-btn" id="nav-analytics" onclick="switchView('analytics')">📊 Cost Analytics</button>
      </nav>

      <div class="sidebar-footer">
        <div id="sidebar-user" class="user-email">Driver Mode</div>
        <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="main-content">
      
      <!-- View 1: Fleet Dashboard -->
      <section id="view-fleet">
        <div class="view-header">
          <h2>Fleet Overview</h2>
          <div class="actions">
            <input type="text" id="search-plate" class="input-search" placeholder="Search plate number..." oninput="filterTrucks()">
            <button class="btn btn-amber" onclick="openAddTruckModal()">+ Add Truck</button>
          </div>
        </div>

        <div id="trucks-container" class="trucks-grid">
          <!-- Truck Cards Render Here -->
        </div>
      </section>

      <!-- View 2: Truck Detail View (Hidden by default) -->
      <section id="view-truck-detail" class="hidden">
        <div class="detail-header">
          <button class="btn btn-ghost btn-sm" onclick="switchView('fleet')">← Back to Fleet</button>
          <div class="truck-summary-card">
            <div>
              <span id="detail-plate" class="plate-title">---</span>
              <div id="detail-meta" class="meta-info">Loading truck info...</div>
            </div>
            <button class="btn btn-amber" onclick="openAddRepairModal()">+ Log Repair Job</button>
          </div>
        </div>

        <div class="repairs-section">
          <div class="section-header">
            <h3>Maintenance & Repair History</h3>
          </div>
          <div id="repairs-tree-container">
            <!-- Repair Tree Renders Here -->
          </div>
        </div>
      </section>

      <!-- View 3: Analytics (Hidden by default) -->
      <section id="view-analytics" class="hidden">
        <div class="view-header">
          <h2>Cost Analytics</h2>
        </div>
        <div class="repairs-section">
          <p class="meta-info">Analytics and breakdown reports will display here.</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal: Add Truck -->
  <div id="modal-add-truck" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Add New Truck</h3>
      <form id="form-add-truck" onsubmit="handleAddTruck(event)">
        <div class="field">
          <label for="truck-plate">License Plate / ID</label>
          <input type="text" id="truck-plate" required placeholder="e.g. AB-123-CD">
        </div>
        <div class="field">
          <label for="truck-model">Make / Model</label>
          <input type="text" id="truck-model" placeholder="e.g. Volvo FH16">
        </div>
        <div class="field">
          <label for="truck-year">Year</label>
          <input type="number" id="truck-year" placeholder="2022">
        </div>
        <div id="truck-msg" class="msg msg-error"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('modal-add-truck')">Cancel</button>
          <button type="submit" class="btn btn-amber">Save Truck</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add Repair -->
  <div id="modal-add-repair" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Log Repair Job</h3>
      <form id="form-add-repair" onsubmit="handleAddRepair(event)">
        <div class="field">
          <label for="repair-date">Date</label>
          <input type="date" id="repair-date" required>
        </div>
        <div class="field">
          <label for="repair-desc">Description / Service</label>
          <input type="text" id="repair-desc" required placeholder="e.g. Brake pad replacement">
        </div>
        <div class="field">
          <label for="repair-cost">Cost ($)</label>
          <input type="number" step="0.01" id="repair-cost" required placeholder="0.00">
        </div>
        <div class="field">
          <label for="repair-status">Status</label>
          <select id="repair-status" class="input-select">
            <option value="completed">Completed</option>
            <option value="in-progress">In Progress</option>
            <option value="pending">Pending</option>
          </select>
        </div>
        <div id="repair-msg" class="msg msg-error"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('modal-add-repair')">Cancel</button>
          <button type="submit" class="btn btn-amber">Save Repair</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Photo Viewer Modal -->
  <div id="modal-photo" class="modal-overlay hidden" onclick="closeModal('modal-photo')">
    <div class="modal-photo-card" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal('modal-photo')">×</button>
      <img id="modal-photo-img" src="" alt="Repair receipt / photo">
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Firebase & Application Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
