<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Truck Tracker</title>
<script>
(function(){var t=localStorage.getItem('truck-tracker-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="theme-toggle-wrap">
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark theme">
    <span class="knob"></span>
  </button>
</div>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="plate">TT</span>
      <div>
        <h1>Set New Password</h1>
        <div class="sub">Truck Tracker</div>
      </div>
    </div>

    <div id="reset-ready" class="hidden">
      <div id="reset-msg" class="msg"></div>
      <form id="form-reset">
        <div class="field">
          <label for="reset-password">New password</label>
          <input type="password" id="reset-password" required autocomplete="new-password" minlength="8">
        </div>
        <div class="field">
          <label for="reset-password2">Confirm new password</label>
          <input type="password" id="reset-password2" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">Set new password</button>
      </form>
    </div>

    <p id="reset-waiting" style="font-size:0.85rem;color:var(--ink-soft);">
      Verifying your reset link... if nothing happens in a few seconds, the link may have expired —
      go back and request a new one.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
<script src="auth.js"></script>
<script>
  // Hide the "waiting" text once the form becomes ready
  const obs = new MutationObserver(() => {
    if (!document.getElementById('reset-ready').classList.contains('hidden')) {
      document.getElementById('reset-waiting').classList.add('hidden');
    }
  });
  obs.observe(document.getElementById('reset-ready'), { attributes: true });
</script>
</body>
</html>
